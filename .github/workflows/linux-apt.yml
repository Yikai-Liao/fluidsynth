name: Linux APT preparation experiment
'on':
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: Screen APT setup changes or validate the full native matrix
        options:
        - screen
        - full
        default: screen
  push:
    branches:
    - ci/linux-apt-20261019
permissions:
  contents: read
env:
  BUILD_TYPE: RelWithDebInfo
  INSTALL_LOCATION: ${{ github.workspace }}/fluidsynth_install
  DEBIAN_FRONTEND: noninteractive
defaults:
  run:
    shell: bash
jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      cases: ${{ steps.matrix.outputs.cases }}
      modes: ${{ steps.matrix.outputs.modes }}
    steps:
    - uses: actions/checkout@v7
    - name: Select build configurations
      id: matrix
      env:
        EXPERIMENT_SCOPE: ${{ inputs.scope || 'screen' }}
      run: |
        python3 - <<'PY_MATRIX'
        import json, os
        cases = json.load(open('.github/ci/linux-dependency-matrix.json'))
        if os.environ['EXPERIMENT_SCOPE'] == 'screen':
            cases = [case for case in cases if case['id'] in ('profiling', 'clang-static')]
        modes = ['original', 'runner-tools'] if os.environ['EXPERIMENT_SCOPE'] == 'full' else ['original', 'no-ppa', 'single-update', 'runner-tools']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('cases=' + json.dumps(cases) + '\n')
            output.write('modes=' + json.dumps(modes) + '\n')
        PY_MATRIX
  native:
    name: ${{ matrix.mode }} / ${{ matrix.case.id }}
    needs: matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.matrix.outputs.modes) }}
        case: ${{ fromJSON(needs.matrix.outputs.cases) }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
    - name: Checkout build submodules
      run: |
        git -c submodule.test/manual.update=none submodule update --init --depth=1 --recursive
    - name: Install Dependencies
      env:
        DEPENDENCY_MODE: ${{ matrix.mode }}
        DEPENDENCY_TIMINGS: ${{ github.workspace }}/ci-evidence/dependency-timings.tsv
      run: |
        mkdir -p ci-evidence
        {
          for tool in cmake ninja clang-15; do
            command -v "$tool"
            "$tool" --version
          done
        } > ci-evidence/tools-before.txt
        dpkg-query -W -f='${binary:Package}\t${Version}\n' > ci-evidence/packages-before.txt
        bash .github/ci/install-linux-apt-experiment.sh "$DEPENDENCY_MODE"
    - name: Configure CMake
      run: |
        export CC=${{ matrix.case.cc }}
        export CXX=${{ matrix.case.cxx }}
        cmake -S . \
          -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_VERBOSE_MAKEFILE=1 \
          -DCMAKE_POSITION_INDEPENDENT_CODE=1 \
          -Werror=dev \
          -DCMAKE_INSTALL_PREFIX=$INSTALL_LOCATION \
          -Denable-portaudio=1 \
          -Denable-ladspa=1 \
          -DNO_GUI=1 \
          ${{ matrix.case.flags }}
    - name: Build
      run: cmake --build build
    - name: Test
      run: cmake --build build --target check
    - name: Demo
      run: cmake --build build --target demo
    - name: Install
      run: cmake --install build && ls -la $INSTALL_LOCATION
    - name: Consume from pkg-config
      if: ${{ contains(matrix.case.flags, 'BUILD_SHARED_LIBS=0') }}
      run: |
        set -e
        cat << EOF > static-link-test.c
        #include <fluidsynth.h>
        int main() { fluid_synth_process(0,0,0,0,0,0); return 0; }
        EOF
        export PKG_CONFIG_PATH=$INSTALL_LOCATION/lib/pkgconfig
        set -x
        g++ -fPIE -o static-link-test static-link-test.c $(pkg-config --cflags --static fluidsynth) $(pkg-config --libs --static fluidsynth)
        ./static-link-test
        echo $?
    - name: Consume from build
      run: |
        set -e
        export CC=${{ matrix.case.cc }}
        export CXX=${{ matrix.case.cxx }}
        cmake -S test/cmake \
          -B consume-build \
          -G Ninja \
          -DFluidSynth_DIR="$GITHUB_WORKSPACE/build" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build consume-build
    - name: Consume from install
      run: |
        set -e
        export CC=${{ matrix.case.cc }}
        export CXX=${{ matrix.case.cxx }}
        cmake -S test/cmake -B consume-install \
          -G Ninja \
          -DFluidSynth_DIR="$INSTALL_LOCATION/lib/cmake/fluidsynth" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build consume-install
    - name: Record build environment
      if: always()
      run: |
        mkdir -p ci-evidence
        printf '%s\n' "$ImageOS" "$ImageVersion" > ci-evidence/runner-image.txt
        uname -a > ci-evidence/uname.txt
        git rev-parse HEAD > ci-evidence/revision.txt
        git submodule status --recursive > ci-evidence/submodules.txt
        dpkg-query -W -f='${binary:Package}\t${Version}\n' > ci-evidence/packages.txt
        cmake --version > ci-evidence/cmake-version.txt
        gcc --version > ci-evidence/gcc-version.txt
        clang-15 --version > ci-evidence/clang-version.txt
        cmake -LA -N build > ci-evidence/cmake-cache.txt 2>&1 || true
        ctest --test-dir build -N > ci-evidence/test-inventory.txt 2>&1 || true
        find build -name config.h -exec cp {} ci-evidence/config.h \;
        du -sb .git/modules/test/manual test/manual 2>/dev/null > ci-evidence/manual-data-size.txt || true
    - name: Upload build evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: evidence-${{ matrix.mode }}-${{ matrix.case.id }}
        path: ci-evidence/
        retention-days: 1
