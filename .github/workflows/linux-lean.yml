name: Linux setup cleanup experiment
'on':
  push:
    branches:
    - ci/linux-lean-20261019
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: Screen changes independently or validate their combination
        options:
        - screen
        - full
        default: screen
permissions:
  contents: read
env:
  BUILD_TYPE: RelWithDebInfo
  INSTALL_LOCATION: ${{ github.workspace }}/fluidsynth_install
  DEBIAN_FRONTEND: noninteractive
defaults:
  run:
    shell: bash
jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      cases: ${{ steps.matrix.outputs.cases }}
      modes: ${{ steps.matrix.outputs.modes }}
    steps:
    - uses: actions/checkout@v7
    - name: Select build configurations
      id: matrix
      env:
        EXPERIMENT_SCOPE: ${{ inputs.scope || 'screen' }}
      run: "python3 - <<'PY_MATRIX'\nimport json, os\ncases = json.load(open('.github/ci/linux-dependency-matrix.json'))\nif os.environ['EXPERIMENT_SCOPE'] == 'screen':\n\
        \    cases = [case for case in cases if case['id'] in ('profiling', 'clang-static')]\nmodes = ['original', 'lean'] if os.environ['EXPERIMENT_SCOPE'] == 'full'\
        \ else ['original', 'no-sdl', 'no-manual', 'lean']\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write('cases=' + json.dumps(cases)\
        \ + '\\n')\nPY_MATRIX\n    output.write('modes=' + json.dumps(modes) + '\\n')\n"
  native:
    name: ${{ matrix.mode }} / ${{ matrix.case.id }}
    needs: matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.matrix.outputs.modes) }}
        case: ${{ fromJSON(needs.matrix.outputs.cases) }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
    - name: Checkout build submodules
      env:
        DEPENDENCY_MODE: ${{ matrix.mode }}
      run: "if [[ $DEPENDENCY_MODE == no-manual || $DEPENDENCY_MODE == lean ]]; then\n  git -c submodule.test/manual.update=none submodule update --init --recursive\n\
        else\n  git submodule update --init --recursive\nfi\n"
    - name: Install Dependencies
      env:
        DEPENDENCY_MODE: ${{ matrix.mode }}
      run: bash .github/ci/install-linux-dependencies.sh "$DEPENDENCY_MODE"
    - name: Configure CMake
      run: "export CC=${{ matrix.case.cc }}\nexport CXX=${{ matrix.case.cxx }}\ncmake -S . \\\n  -B build \\\n  -G Ninja \\\n  -DCMAKE_BUILD_TYPE=$BUILD_TYPE \\\n\
        \  -DCMAKE_VERBOSE_MAKEFILE=1 \\\n  -DCMAKE_POSITION_INDEPENDENT_CODE=1 \\\n  -Werror=dev \\\n  -DCMAKE_INSTALL_PREFIX=$INSTALL_LOCATION \\\n  -Denable-portaudio=1\
        \ \\\n  -Denable-ladspa=1 \\\n  -DNO_GUI=1 \\\n  ${{ matrix.case.flags }}\n"
    - name: Build
      run: cmake --build build
    - name: Test
      run: cmake --build build --target check
    - name: Demo
      run: cmake --build build --target demo
    - name: Install
      run: cmake --install build && ls -la $INSTALL_LOCATION
    - name: Consume from pkg-config
      if: ${{ contains(matrix.case.flags, 'BUILD_SHARED_LIBS=0') }}
      run: 'set -e

        cat << EOF > static-link-test.c

        #include <fluidsynth.h>

        int main() { fluid_synth_process(0,0,0,0,0,0); return 0; }

        EOF

        export PKG_CONFIG_PATH=$INSTALL_LOCATION/lib/pkgconfig

        set -x

        g++ -fPIE -o static-link-test static-link-test.c $(pkg-config --cflags --static fluidsynth) $(pkg-config --libs --static fluidsynth)

        ./static-link-test

        echo $?

        '
    - name: Consume from build
      run: "set -e\nexport CC=${{ matrix.case.cc }}\nexport CXX=${{ matrix.case.cxx }}\ncmake -S test/cmake \\\n  -B consume-build \\\n  -G Ninja \\\n  -DFluidSynth_DIR=\"\
        $GITHUB_WORKSPACE/build\" \\\n  -DCMAKE_BUILD_TYPE=$BUILD_TYPE\ncmake --build consume-build\n"
    - name: Consume from install
      run: "set -e\nexport CC=${{ matrix.case.cc }}\nexport CXX=${{ matrix.case.cxx }}\ncmake -S test/cmake -B consume-install \\\n  -G Ninja \\\n  -DFluidSynth_DIR=\"\
        $INSTALL_LOCATION/lib/cmake/fluidsynth\" \\\n  -DCMAKE_BUILD_TYPE=$BUILD_TYPE\ncmake --build consume-install\n"
    - name: Record build environment
      if: always()
      run: 'mkdir -p ci-evidence

        printf ''%s\n'' "$ImageOS" "$ImageVersion" > ci-evidence/runner-image.txt

        uname -a > ci-evidence/uname.txt

        git rev-parse HEAD > ci-evidence/revision.txt

        git submodule status --recursive > ci-evidence/submodules.txt

        dpkg-query -W -f=''${binary:Package}\t${Version}\n'' > ci-evidence/packages.txt

        cmake --version > ci-evidence/cmake-version.txt

        gcc --version > ci-evidence/gcc-version.txt

        clang-15 --version > ci-evidence/clang-version.txt

        cmake -LA -N build > ci-evidence/cmake-cache.txt 2>&1 || true

        ctest --test-dir build -N > ci-evidence/test-inventory.txt 2>&1 || true

        find build -name config.h -exec cp {} ci-evidence/config.h \;

        du -sb .git/modules/test/manual test/manual 2>/dev/null > ci-evidence/manual-data-size.txt || true

        '
    - name: Upload build evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: evidence-${{ matrix.mode }}-${{ matrix.case.id }}
        path: ci-evidence/
        retention-days: 1
