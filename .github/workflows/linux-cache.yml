name: Linux dependency cache experiment
'on':
  push:
    branches:
    - ci/dependency-reuse-20261019
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: Screen two configurations or validate the full native matrix
        options:
        - screen
        - full
        default: screen
permissions:
  contents: read
env:
  BUILD_TYPE: RelWithDebInfo
  INSTALL_LOCATION: ${{ github.workspace }}/fluidsynth_install
  DEBIAN_FRONTEND: noninteractive
defaults:
  run:
    shell: bash
jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      cases: ${{ steps.matrix.outputs.cases }}
    steps:
    - uses: actions/checkout@v7
    - name: Select build configurations
      id: matrix
      env:
        EXPERIMENT_SCOPE: ${{ inputs.scope || 'screen' }}
      run: |
        python3 - <<'PY_MATRIX'
        import json, os
        cases = json.load(open('.github/ci/linux-dependency-matrix.json'))
        if os.environ['EXPERIMENT_SCOPE'] == 'screen':
            cases = [case for case in cases if case['id'] in ('profiling', 'clang-static')]
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('cases=' + json.dumps(cases) + '\n')
        PY_MATRIX
  native:
    name: ${{ matrix.mode }} / ${{ matrix.case.id }}
    needs: matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode:
        - original
        - cached
        case: ${{ fromJSON(needs.matrix.outputs.cases) }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Identify dependency cache
      id: key
      env:
        RECIPE_HASH: ${{ hashFiles('.github/ci/linux-dependencies.txt', '.github/ci/install-linux-dependencies.sh', '.github/ci/linux-apt-bundle.sh')
          }}
      run: |
        printf 'key=fluidsynth-ci-20261019-apt-v1-%s-%s-%s-%s-%s\n' "$ImageOS" "$ImageVersion" "$(dpkg --print-architecture)" "$(date -u +%G%V)" "$RECIPE_HASH" >> "$GITHUB_OUTPUT"
    - name: Restore dependency bundle
      if: matrix.mode == 'cached'
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.APT_BUNDLE_DIR }}
        key: ${{ steps.key.outputs.key }}
    - name: Install Dependencies
      id: dependencies
      env:
        DEPENDENCY_MODE: ${{ matrix.mode }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: bash .github/ci/linux-apt-bundle.sh "$DEPENDENCY_MODE"
    - name: Save dependency bundle
      if: matrix.mode == 'cached' && matrix.case.id == 'profiling' && steps.cache.outputs.cache-hit != 'true' && steps.dependencies.outputs.cacheable
        == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ env.APT_BUNDLE_DIR }}
        key: ${{ steps.key.outputs.key }}
    - name: Configure CMake
      run: |
        export CC=${{ matrix.case.cc }}
        export CXX=${{ matrix.case.cxx }}
        cmake -S . \
          -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
          -DCMAKE_VERBOSE_MAKEFILE=1 \
          -DCMAKE_POSITION_INDEPENDENT_CODE=1 \
          -Werror=dev \
          -DCMAKE_INSTALL_PREFIX=$INSTALL_LOCATION \
          -Denable-portaudio=1 \
          -Denable-ladspa=1 \
          -DNO_GUI=1 \
          ${{ matrix.case.flags }}
    - name: Build
      run: cmake --build build
    - name: Test
      run: cmake --build build --target check
    - name: Demo
      run: cmake --build build --target demo
    - name: Install
      run: cmake --install build && ls -la $INSTALL_LOCATION
    - name: Consume from pkg-config
      if: ${{ contains(matrix.case.flags, 'BUILD_SHARED_LIBS=0') }}
      run: |
        set -e
        cat << EOF > static-link-test.c
        #include <fluidsynth.h>
        int main() { fluid_synth_process(0,0,0,0,0,0); return 0; }
        EOF
        export PKG_CONFIG_PATH=$INSTALL_LOCATION/lib/pkgconfig
        set -x
        g++ -fPIE -o static-link-test static-link-test.c $(pkg-config --cflags --static fluidsynth) $(pkg-config --libs --static fluidsynth)
        ./static-link-test
        echo $?
    - name: Consume from build
      run: |
        set -e
        export CC=${{ matrix.case.cc }}
        export CXX=${{ matrix.case.cxx }}
        cmake -S test/cmake \
          -B consume-build \
          -G Ninja \
          -DFluidSynth_DIR="$GITHUB_WORKSPACE/build" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build consume-build
    - name: Consume from install
      run: |
        set -e
        export CC=${{ matrix.case.cc }}
        export CXX=${{ matrix.case.cxx }}
        cmake -S test/cmake -B consume-install \
          -G Ninja \
          -DFluidSynth_DIR="$INSTALL_LOCATION/lib/cmake/fluidsynth" \
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        cmake --build consume-install
    - name: Record build environment
      if: always()
      run: |
        mkdir -p ci-evidence
        printf '%s\n' "$ImageOS" "$ImageVersion" > ci-evidence/runner-image.txt
        uname -a > ci-evidence/uname.txt
        git rev-parse HEAD > ci-evidence/revision.txt
        git submodule status --recursive > ci-evidence/submodules.txt
        dpkg-query -W -f='${binary:Package}\t${Version}\n' > ci-evidence/packages.txt
        cmake --version > ci-evidence/cmake-version.txt
        gcc --version > ci-evidence/gcc-version.txt
        clang-15 --version > ci-evidence/clang-version.txt
        cmake -LA -N build > ci-evidence/cmake-cache.txt 2>&1 || true
        ctest --test-dir build -N > ci-evidence/test-inventory.txt 2>&1 || true
        find build -name config.h -exec cp {} ci-evidence/config.h \;
        if [[ -f "$DEPENDENCY_TIMINGS" ]]; then cp "$DEPENDENCY_TIMINGS" ci-evidence/setup-timings.tsv; fi
        if [[ -f "$RUNNER_TEMP/apt-bundle-info.txt" ]]; then cp "$RUNNER_TEMP/apt-bundle-info.txt" ci-evidence/apt-bundle-info.txt; fi
    - name: Upload build evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: evidence-${{ matrix.mode }}-${{ matrix.case.id }}
        path: ci-evidence/
        retention-days: 1
    env:
      APT_BUNDLE_DIR: ${{ runner.temp }}/fluidsynth-linux-apt-bundle
      DEPENDENCY_TIMINGS: ${{ runner.temp }}/dependency-timings.tsv
