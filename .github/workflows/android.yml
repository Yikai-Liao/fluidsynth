name: FluidSynth Android

on:
  workflow_dispatch:
  # Run every PR so path filters cannot leave required checks pending.
  pull_request:
  push:
    branches: ['**']
    paths:
      - '**'
      - '!.azure/**'
      - '!.circleci/**'
      - '!.github/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android-*.sh'
      - '!README.md'
  schedule:
    # Retain Azure's weekly build without dependency caches.
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NDK_VERSION: '27.3.13750724'
  # The pinned ARM runtime images only support API 24.
  ANDROID_API: '24'

jobs:
  build-test:
    env:
      ABI: ${{ matrix.abi }}
    name: Build and test ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout build dependencies
        run: git -c submodule.test/manual.update=none submodule update --init --depth=1 --recursive
      - name: Locate the pinned NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -f "$ndk/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          cmake --version
          cat "$ndk/source.properties"
      - uses: actions/cache/restore@v5
        id: dependencies
        if: ${{ github.event_name != 'schedule' }}
        with:
          path: build/android/prefix
          # Bump v1 when changing dependency versions, build flags or installation policy.
          key: android-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.abi }}-api${{ env.ANDROID_API }}-ndk${{ env.NDK_VERSION }}
      - name: Build dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: bash .github/scripts/android-build-and-package.sh build-dependencies
      # Save before FluidSynth installs into the same prefix.
      - uses: actions/cache/save@v5
        if: ${{ github.event_name != 'schedule' && steps.dependencies.outputs.cache-hit != 'true' }}
        with:
          path: build/android/prefix
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build and install FluidSynth, test executables and asset loader
        run: bash .github/scripts/android-build-and-package.sh build-and-install
      - name: Verify and package shared libraries and headers
        run: bash .github/scripts/android-build-and-package.sh package
      - name: Cache the emulator and API 24 system image
        uses: actions/cache@v5
        if: ${{ (matrix.abi == 'x86' || matrix.abi == 'x86_64') && github.event_name != 'schedule' }}
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images/android-${{ env.ANDROID_API }}/default/${{ matrix.abi }}
            ${{ env.ANDROID_HOME }}/emulator
          # Bump v1 when updating the emulator or SDK system image revision.
          key: android-emulator-v1-${{ runner.os }}-${{ runner.arch }}-api${{ env.ANDROID_API }}-default-${{ matrix.abi }}
      - name: Install the emulator image and grant KVM access
        if: matrix.abi == 'x86' || matrix.abi == 'x86_64'
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          packages=()
          if [[ ! -f "$ANDROID_HOME/system-images/android-$ANDROID_API/default/$ABI/source.properties" ]]; then
            packages+=("system-images;android-$ANDROID_API;default;$ABI")
          fi
          if [[ ! -x "$ANDROID_HOME/emulator/emulator" ]]; then packages+=(emulator); fi
          if [[ ! -x "$ANDROID_HOME/platform-tools/adb" ]]; then packages+=(platform-tools); fi
          if (( ${#packages[@]} )); then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}"
          fi
          cat "$ANDROID_HOME/emulator/source.properties"
          cat "$ANDROID_HOME/system-images/android-$ANDROID_API/default/$ABI/source.properties"
      - name: Run native tests in the emulator
        if: matrix.abi == 'x86' || matrix.abi == 'x86_64'
        run: bash .github/scripts/android-run-emulator.sh build/android "$ABI"
      - name: Bundle ARM test executables, data and libraries
        if: matrix.abi == 'armeabi-v7a' || matrix.abi == 'arm64-v8a'
        run: |
          bundle="$RUNNER_TEMP/android-tests"
          test_dir=build/android/build/fluidsynth/test
          mkdir -p "$bundle/lib"
          for executable in "$test_dir"/test_*; do
            [[ -f "$executable" && -x "$executable" ]] || continue
            cp -a "$executable" "$bundle/"
          done
          cp -a "$test_dir/sf2" "$test_dir/test" "$bundle/"
          cp -a "build/android/package/lib/$ABI/." "$bundle/lib/"
          tar -C "$bundle" -czf "$RUNNER_TEMP/android-tests.tar.gz" .
      - uses: actions/upload-artifact@v7
        if: matrix.abi == 'armeabi-v7a' || matrix.abi == 'arm64-v8a'
        with:
          name: android-tests-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-tests.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: fluidsynth-android${{ env.ANDROID_API }}-${{ matrix.abi }}
          path: build/android/package
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-logs-${{ matrix.abi }}
          path: |
            build/android/logs
            build/android/build/**/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14

  # Hosted ARM runners do not expose nested KVM. Execute Android/Bionic tests
  # on their Linux kernel; Android framework services and device drivers remain
  # outside this path's coverage. Keep x86 Android emulator tests above.
  arm-tests:
    env:
      ABI: ${{ matrix.abi }}
    name: Native Android/Bionic ${{ matrix.abi }}
    needs: build-test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-tests-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-tests
      - name: Cache the pinned API 24 ARM userspace
        id: runtime
        uses: actions/cache@v5
        if: ${{ github.event_name != 'schedule' }}
        with:
          path: ${{ runner.temp }}/android-runtime
          # Bump v1 when changing pinned images or the extracted runtime contents.
          key: android-native-runtime-v1-${{ runner.os }}-${{ runner.arch }}-api${{ env.ANDROID_API }}-${{ matrix.abi }}
      - name: Extract the Android userspace
        if: steps.runtime.outputs.cache-hit != 'true'
        run: bash .github/scripts/android-prepare-runtime.sh "$ABI" "$RUNNER_TEMP/android-runtime"
      - name: Run native ARM Android binaries
        run: |
          bash .github/scripts/android-run-native-tests.sh "$ABI" "$RUNNER_TEMP/android-runtime" \
            "$RUNNER_TEMP/android-tests/android-tests.tar.gz" "$RUNNER_TEMP/native-tests"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-native-logs-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/native-tests/logs
            ${{ runner.temp }}/native-tests/results.txt
            ${{ runner.temp }}/android-runtime/provenance.txt
          retention-days: 14
