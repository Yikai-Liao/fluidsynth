name: FluidSynth Android

on:
  workflow_dispatch:
  # Run every PR so path filters cannot leave required checks pending.
  pull_request:
  push:
    branches: ['**']
    paths:
      - '**'
      - '!.azure/**'
      - '!.circleci/**'
      - '!.github/**'
      - '.github/workflows/android.yml'
      - '.github/scripts/android/**'
      - '!README.md'
  schedule:
    # Access default-branch caches within GitHub's default 7-day idle limit.
    - cron: '17 3 * * 1,4'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NDK_VERSION: '27.3.13750724'
  # Run compatibility tests at the minimum supported API level.
  ANDROID_API: '24'

jobs:
  build:
    env:
      ABI: ${{ matrix.abi }}
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Keep target and test-environment choices in one table for both jobs.
      matrix: &android_targets
        include:
          - {abi: x86, test_runner: ubuntu-24.04, test_backend: emulator}
          - {abi: x86_64, test_runner: ubuntu-24.04, test_backend: emulator}
          # Hosted ARM runners use the host kernel with Android's Bionic userspace.
          - {abi: armeabi-v7a, test_runner: ubuntu-24.04-arm, test_backend: chroot}
          - {abi: arm64-v8a, test_runner: ubuntu-24.04-arm, test_backend: chroot}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout build dependencies
        run: git -c submodule.test/manual.update=none submodule update --init --depth=1 --recursive
      - name: Locate the pinned NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -f "$ndk/build/cmake/android.toolchain.cmake" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          cmake --version
          cat "$ndk/source.properties"
      - name: Build dependencies, FluidSynth, tests and SDK artifact
        run: bash .github/scripts/android/build.sh "$ABI" build/android
      - name: Cache the ARM Android userspace
        if: matrix.test_backend == 'chroot'
        id: runtime
        uses: actions/cache@v5
        with:
          path: build/android/runtime
          # Bump v3 when updating SDK system image revisions or extracted contents.
          key: android-native-runtime-v3-api${{ env.ANDROID_API }}-${{ matrix.abi }}
      - name: Install and extract the ARM Android userspace
        if: matrix.test_backend == 'chroot' && steps.runtime.outputs.cache-hit != 'true'
        run: bash .github/scripts/android/prepare-runtime.sh "$ABI" build/android/runtime
      - name: Bundle tests and runtime
        run: |
          paths=(tests)
          if [[ -d build/android/runtime ]]; then paths+=(runtime); fi
          tar -C build/android -czf "$RUNNER_TEMP/android-tests.tar.gz" "${paths[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: android-tests-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-tests.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: fluidsynth-android${{ env.ANDROID_API }}-${{ matrix.abi }}
          path: build/android/package
          if-no-files-found: error
          retention-days: 14

  test:
    # Consume each available bundle even if another ABI fails to build.
    if: ${{ !cancelled() }}
    needs: build
    name: Test ${{ matrix.abi }} (${{ matrix.test_backend }})
    runs-on: ${{ matrix.test_runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: *android_targets
    env:
      ABI: ${{ matrix.abi }}
      TEST_BACKEND: ${{ matrix.test_backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-tests-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-tests
      - name: Extract test bundle
        run: tar -xzf "$RUNNER_TEMP/android-tests/android-tests.tar.gz" -C "$RUNNER_TEMP/android-tests"
      - name: Locate the Android SDK for caching
        if: matrix.test_backend == 'emulator'
        run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Cache the emulator and API 24 system image
        uses: actions/cache@v5
        if: matrix.test_backend == 'emulator'
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images/android-${{ env.ANDROID_API }}/default/${{ matrix.abi }}
            ${{ env.ANDROID_HOME }}/emulator
          # Bump v1 when updating the emulator or SDK system image revision.
          key: android-emulator-v1-${{ runner.os }}-${{ runner.arch }}-api${{ env.ANDROID_API }}-default-${{ matrix.abi }}
      - name: Install the emulator image and grant KVM access
        if: matrix.test_backend == 'emulator'
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          packages=()
          if [[ ! -f "$ANDROID_HOME/system-images/android-$ANDROID_API/default/$ABI/source.properties" ]]; then
            packages+=("system-images;android-$ANDROID_API;default;$ABI")
          fi
          if [[ ! -x "$ANDROID_HOME/emulator/emulator" ]]; then packages+=(emulator); fi
          if [[ ! -x "$ANDROID_HOME/platform-tools/adb" ]]; then packages+=(platform-tools); fi
          if (( ${#packages[@]} )); then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${packages[@]}"
          fi
          cat "$ANDROID_HOME/emulator/source.properties"
          cat "$ANDROID_HOME/system-images/android-$ANDROID_API/default/$ABI/source.properties"
      - name: Run Android tests
        run: timeout 900 bash .github/scripts/android/test.sh "$TEST_BACKEND" "$ABI" "$RUNNER_TEMP/android-tests"
